name: Desktop Windows

# Compila el instalador de Windows y lo sube a la MISMA release del APK (v0.1.0).
# El APK no se toca: action-gh-release solo añade el .exe a la release existente.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release donde subir el instalador (vacío = la última)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VITE_YT_API_KEY: ${{ secrets.VITE_YT_API_KEY }}
      VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
      VITE_AUDD_API_KEY: ${{ secrets.VITE_AUDD_API_KEY }}
      VITE_AUDIO_API: ${{ secrets.VITE_AUDIO_API }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SPOTIFY_API: ${{ secrets.VITE_SPOTIFY_API }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependencias
        working-directory: desktop
        run: npm ci

      - name: Compilar aplicación
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          npx vite build 2>&1 | tee build.log || {
            tail -25 build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      # Genera desktop/release/PoP Music Setup.exe
      - name: Generar instalador Windows
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never

      # PoP Music para escritorio deriva de Liner, cuya licencia no permite
      # distribución pública. El instalador se guarda como artefacto privado
      # del workflow (solo accesible para los colaboradores del repo) y NO se
      # publica en Releases. La APK de Android no se toca.
      - name: Guardar instalador como artefacto privado
        uses: actions/upload-artifact@v4
        with:
          name: PoP-Music-Windows
          path: desktop/release/*.exe
          if-no-files-found: error
