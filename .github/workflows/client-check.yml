name: Cliente y backend

# Comprueba que el cliente limpio y el backend propio siguen compilando.
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'backend/**'
      - '.github/workflows/client-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar cliente
        working-directory: client
        run: npm ci

      - name: Compilar cliente
        working-directory: client
        run: npm run build

      - name: Comprobar sintaxis del backend
        working-directory: backend
        run: |
          node --check server.mjs
          node --check lib/handler.mjs
          node --check lib/audio.mjs
          node --check 'api/[...path].js'
